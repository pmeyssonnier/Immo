# Verifications automatiques a chaque modification du code.
#
# Ce workflow n'utilise AUCUNE action externe (aucun "uses:"). Raison : quand un
# depot change de visibilite, GitHub reinitialise la politique des actions
# autorisees, et meme les actions officielles (actions/checkout) se retrouvent
# bloquees -- tous les workflows echouent alors au demarrage. En se limitant a
# des commandes, ce workflow fonctionne quelle que soit cette politique.
#
# Le runner Ubuntu fournit deja Python 3 et Node : rien a installer.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        run: |
          git clone --depth 1 --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" .
          echo "python : $(python3 --version) | node : $(node --version)"

      - name: Nettoyage des données DVF (pièges du format, contours, chaîne complète)
        run: python3 -m unittest discover tests -v

      - name: Modules JavaScript purs (estimation, recherche, mise en forme)
        # Les fichiers sont listés un par un : « node --test tests/ » ramasserait
        # aussi verification_navigateur.mjs, qui exige un navigateur et
        # playwright-core, absents du serveur d'intégration.
        #
        # Cette liste explicite a un défaut : un fichier de tests ajouté au dépôt
        # n'est jamais lancé tant que personne ne pense à l'inscrire ici. C'est
        # ce qui est arrivé à test_demandes.mjs et test_donnees.mjs, écrits puis
        # oubliés. Ils y sont maintenant.
        run: >-
          node --test
          tests/test_estimation.mjs
          tests/test_recherche.mjs
          tests/test_format.mjs
          tests/test_donnees.mjs
          tests/test_demandes.mjs
