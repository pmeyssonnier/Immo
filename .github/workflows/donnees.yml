# Robot de mise a jour des donnees.
#
# Il tourne sur les serveurs de GitHub (qui ont acces a internet), telecharge les
# ventes publiees par l'Etat, fabrique les fichiers du dossier data/ et les
# enregistre dans le depot. Le site se met alors a jour tout seul.
#
# Trois facons de le lancer :
#   1. tout seul, le 5 de chaque mois ;
#   2. a la main : onglet "Actions" > "Mise a jour des donnees DVF" > "Run workflow" ;
#   3. en modifiant le fichier .github/declencher-donnees.txt (y ecrire la date
#      du jour suffit). Pratique quand le bouton n'est pas accessible.
#
# Comme tests.yml, ce workflow n'utilise AUCUNE action externe : il reste donc
# fonctionnel meme si la politique du depot bloque actions/checkout.

name: Mise à jour des données DVF

on:
  schedule:
    - cron: "0 3 5 * *"
  workflow_dispatch:
    inputs:
      annees:
        description: "Nombre d'années d'historique à récupérer"
        default: "5"
        required: false
  push:
    branches: [main]
    paths:
      # Écrire n'importe quoi dans ce fichier relance le robot.
      - ".github/declencher-donnees.txt"
      # Si la logique de nettoyage change, les données doivent être refaites.
      - "scripts/preparer_donnees.py"

permissions:
  contents: write        # indispensable pour réenregistrer le dossier data/

concurrency:
  group: donnees-dvf
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # La branche de publication est ecrite noir sur blanc, et non deduite du
      # declencheur. Le robot utilisait $GITHUB_REF_NAME pour le clone comme
      # pour le push : sur un lancement manuel ou planifie, cette variable vaut
      # la reference choisie au moment du declenchement, donc les donnees
      # pouvaient atterrir sur une branche de travail. Le site n'en a qu'une.
      # Consequence assumee : lancer le robot a la main depuis une autre branche
      # construit et publie quand meme les donnees de main.
      BRANCHE: main
    steps:
      - name: Récupérer le code
        run: |
          git clone --branch "$BRANCHE" \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" .
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Télécharger et préparer les données
        run: python3 scripts/preparer_donnees.py --annees "${{ inputs.annees || '5' }}" --sortie data

      - name: Afficher le rapport
        if: always()
        run: |
          echo '## Rapport de préparation' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat data/_rapport.txt >> "$GITHUB_STEP_SUMMARY" || echo "(aucun rapport)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Contrôles de cohérence
        # Mieux vaut faire échouer le robot que publier des chiffres absurdes.
        run: python3 scripts/preparer_donnees.py --verifier data

      - name: Vérifier que le site sert bien ces données
        run: python3 -m unittest tests.test_site -v

      - name: Enregistrer les nouvelles données
        run: |
          git add data
          if git diff --staged --quiet; then
            echo "Aucun changement : les données étaient déjà à jour."
            exit 0
          fi
          git commit -m "Données DVF mises à jour ($(date +%F))"
          # La préparation dure quelques minutes. Si quelqu'un pousse sur la
          # branche pendant ce temps, le push est refusé et tout le travail est
          # jeté -- c'est arrivé. On rejoue donc le commit par-dessus ce qui est
          # arrivé entre-temps. Le robot ne touche que data/, et la concurrence
          # interdit deux robots à la fois : un conflit serait donc anormal, et
          # doit faire échouer bruyamment plutôt que d'être résolu au hasard.
          for tentative in 1 2 3; do
            if git push origin "HEAD:$BRANCHE"; then
              exit 0
            fi
            echo "La branche a bougé pendant la préparation ; on rejoue par-dessus (tentative $tentative)."
            git fetch origin "$BRANCHE"
            git rebase "origin/$BRANCHE"
          done
          echo "::error::publication impossible après 3 tentatives"
          exit 1
